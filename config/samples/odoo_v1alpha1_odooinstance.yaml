apiVersion: odoo.cloud104.io/v1alpha1
kind: OdooInstance
metadata:
  labels:
    app.kubernetes.io/name: odooinstance
    app.kubernetes.io/managed-by: kustomize
  name: meu-erp
spec:
  domain: meu-erp-app.francis.tcloud-devops.cloudtotvs.com.br
  odoo:
    image: odoo:17.0
    replicas: 1
    storageSize: 2Gi
  database:
    image: postgres:16
    user: odoo
    storageSize: 2Gi